name: Publish npm beta
run-name: Publish npm ${{ inputs.release_version }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact package.json version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.release_version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12.0.1
      - name: Verify release request
        run: pnpm check:release-request
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run default quality gate
        run: pnpm check
      - name: Inspect package contents
        run: pnpm pack --dry-run --json
      - name: Run fresh-cache package install integration
        run: pnpm test:package-install
      - name: Publish to npm with trusted publishing
        run: npm publish --access public --tag beta
